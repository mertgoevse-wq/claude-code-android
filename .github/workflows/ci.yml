name: CI

on:
  push:
    branches:
      - 'task/**'
      - 'fix/**'
      - 'release/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make scripts executable
        run: |
          chmod +x gradlew
          chmod +x tools/*.sh tools/*.py scripts/*.sh 2>/dev/null || true

      - name: Run Manifest & Policy Checkers
        run: |
          python3 tools/check_doc_manifest.py
          python3 tools/check_source_manifest.py --phase 0
          python3 tools/check_no_android_imports_in_shared.py
          bash scripts/check-no-secrets.sh
          bash scripts/check-no-analytics.sh

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/reports/tests/
            **/build/reports/problems/
          if-no-files-found: ignore
